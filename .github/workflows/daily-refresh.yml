name: Daily refresh

on:
  schedule:
    # 15:00 UTC = 8:00 AM PT (PDT). During PST it's 7:00 AM — close enough.
    - cron: "0 15 * * *"
  workflow_dispatch:    # manual trigger via GitHub UI / gh CLI

permissions:
  contents: write       # needed to git push the refreshed files

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run refresh script
        env:
          # GitHub API rate limits are 60/hr unauthenticated, 5000/hr with token.
          # The default GITHUB_TOKEN gives us the higher limit for free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-data.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -m "daily refresh $(date -u '+%Y-%m-%d %H:%MZ')"
          git push
